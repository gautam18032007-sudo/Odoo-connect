name: CI

# Runs today with no secrets required — type-checks, lints, and builds the
# repo on every push/PR. This is distinct from deploy-worker.yml, which
# requires Oracle SSH secrets and won't run successfully until those exist.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Biome
        run: npm run lint

      - name: Build
        run: npm run build
