# OPTIONAL / INERT TODAY.
#
# The always-on sync worker (sync-worker.mjs) has no HTTP server — it's a
# pure background poll loop. Its liveness is read from the worker_heartbeat
# DB table (scripts/check-worker-health.mjs), not a port. This file has
# nothing to reverse-proxy to right now.
#
# Keep this template for if/when a lightweight worker status endpoint is
# added later (e.g. a tiny HTTP server exposing /status on
# WORKER_STATUS_PORT) — activate by uncommenting the upstream/location
# block below and pointing it at that port. Until then, do not enable this
# server block.
#
# Install (once a status endpoint exists):
#   sudo cp deploy/nginx.worker.conf /etc/nginx/sites-available/zenzebra-worker
#   sudo ln -s /etc/nginx/sites-available/zenzebra-worker /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d worker-status.yourdomain.com
#   sudo nginx -t && sudo systemctl reload nginx

# upstream zenzebra_worker_status {
#     server 127.0.0.1:9200; # WORKER_STATUS_PORT, if/when added
# }

server {
	listen 80;
	server_name worker-status.yourdomain.com;

	# Certbot will rewrite this block to redirect to HTTPS once SSL is
	# issued (certbot --nginx handles that automatically).

	location / {
		return 404; # nothing served until a status endpoint exists
	}

	# Uncomment once a status endpoint exists:
	# location / {
	#     proxy_pass http://zenzebra_worker_status;
	#     proxy_http_version 1.1;
	#     proxy_set_header Host $host;
	#     proxy_set_header X-Real-IP $remote_addr;
	#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	#     proxy_set_header X-Forwarded-Proto $scheme;
	#
	#     # Security headers
	#     add_header X-Content-Type-Options "nosniff" always;
	#     add_header X-Frame-Options "DENY" always;
	#     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	#
	#     # Basic rate limiting (define the zone in the http{} block:
	#     # limit_req_zone $binary_remote_addr zone=worker_status:10m rate=10r/s;)
	#     limit_req zone=worker_status burst=20 nodelay;
	#
	#     gzip on;
	#     gzip_types application/json;
	# }
}
